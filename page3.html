<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitter Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b132b">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-blue: #4fa3a5;
            --text-color: #ffffff;
            --text-muted: #95a5a6;
            --safe-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }

        .navbar {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .navbar a {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .navbar a.active {
            background-color: var(--accent-blue);
            color: white;
        }

        .navbar a:hover:not(.active) {
            background-color: #26314f;
            color: white;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 24px;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input {
            background-color: #0b132b;
            border: 1px solid #3a506b;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: #0b132b;
            border-left: 5px solid var(--safe-green);
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 36px;
            font-weight: bold;
            color: var(--safe-green);
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="page2.html">Page 2</a>
    <a href="page3.html" class="active">Page 3</a>
    <a href="page4.html">Page 4</a>
</div>

<div class="container">
    <h2>Max User Calculator</h2>

    <div class="row">
        <div class="input-group">
            <label>Input Power (dBm)</label>
            <input type="number" id="inputPower" step="0.1" oninput="calculateMaxUsers()" placeholder="যেমন: 5.0">
        </div>
    </div>

    <div class="result-box">
        <div class="result-label">সর্বোচ্চ ইউজার সংখ্যা</div>
        <div class="result-value" id="resMaxUsers">-</div>
    </div>
</div>

<script>
    function calculateMaxUsers() {
        const inputPowerRaw = document.getElementById('inputPower').value;
        const resEl = document.getElementById('resMaxUsers');

        if (inputPowerRaw === "") {
            resEl.innerText = "-";
            return;
        }

        const inputPower = parseFloat(inputPowerRaw) || 0;

        // Standard PLC splitter ratios with typical insertion loss (dB)
        const splitterTable = [
            { users: 64, loss: 20.5 },
            { users: 32, loss: 17.0 },
            { users: 16, loss: 13.8 },
            { users: 8, loss: 10.5 },
            { users: 4, loss: 7.2 },
            { users: 2, loss: 3.8 }
        ];

        // Fixed connector + splice + safety margin losses
        const fixedLoss = 1.4;

        const threshold = -25;

        let maxUsers = 0;
        for (const opt of splitterTable) {
            const finalPower = inputPower - opt.loss - fixedLoss;
            if (finalPower >= threshold) {
                maxUsers = opt.users;
                break;
            }
        }

        resEl.innerText = maxUsers > 0 ? maxUsers : "সম্ভব নয়";
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
