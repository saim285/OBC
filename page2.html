<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitter Calculator</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-blue: #4fa3a5;
            --text-color: #ffffff;
            --text-muted: #95a5a6;
            --safe-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }

        .navbar {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .navbar a {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .navbar a.active {
            background-color: var(--accent-blue);
            color: white;
        }

        .navbar a:hover:not(.active) {
            background-color: #26314f;
            color: white;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 24px;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            background-color: #0b132b;
            border: 1px solid #3a506b;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .btn-calc {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-calc:hover {
            background-color: #3b8284;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #0b132b;
            border-left: 5px solid var(--safe-green);
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .result-item.total {
            border-top: 1px dashed #3a506b;
            padding-top: 10px;
            font-weight: bold;
            font-size: 17px;
            color: var(--safe-green);
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="page2.html" class="active">Page 2</a>
    <a href="page3.html">Page 3</a>
    <a href="page4.html">Page 4</a>
</div>

<div class="container">
    <h2>FBT Splitter Loss Calculator</h2>

    <div class="row">
        <div class="input-group">
            <label>Split Percentage (%)</label>
            <input type="number" id="splitPercent" value="50" min="0.1" max="99.9" step="0.1" oninput="calculateFbtLoss()">
        </div>
    </div>
    <p class="hint">যে লেগের লস বের করতে চান তার পার্সেন্টেজ লিখুন (যেমন: 10/90 স্প্লিটারের 10% লেগের জন্য 10 লিখুন)।</p>

    <button class="btn-calc" onclick="calculateFbtLoss()">হিসাব করুন</button>

    <div class="result-box" id="resultBox">
        <div class="result-item">
            <span>Splitter Loss:</span>
            <span id="resSplitterLoss">0.00 dB</span>
        </div>
        <div class="result-item">
            <span>Connector Loss:</span>
            <span id="resConnectorLoss">0.00 dB</span>
        </div>
        <div class="result-item total">
            <span>Total Loss:</span>
            <span id="resTotalLoss">0.00 dB</span>
        </div>
    </div>
</div>

<script>
    function calculateFbtLoss() {
        const percent = parseFloat(document.getElementById('splitPercent').value) || 0.1;

        const splitterLoss = 10 * Math.log10(100 / percent);
        const connectorLoss = 0.3; // Fixed connector loss, auto-added
        const totalLoss = splitterLoss + connectorLoss;

        document.getElementById('resSplitterLoss').innerText = splitterLoss.toFixed(2) + " dB";
        document.getElementById('resConnectorLoss').innerText = connectorLoss.toFixed(2) + " dB";
        document.getElementById('resTotalLoss').innerText = totalLoss.toFixed(2) + " dB";

        document.getElementById('resultBox').style.display = 'block';
    }

    calculateFbtLoss();
</script>

</body>
</html>
